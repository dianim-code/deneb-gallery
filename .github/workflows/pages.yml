name: pages

# Deploys site/ to GitHub Pages. site/ is self-contained: the gallery data and the template
# copies are generated by scripts/build_gallery_data.py and committed.
# Enable it in the repo settings: Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the gallery exists
        run: test -f site/index.html || { echo "::error::site/index.html not found"; exit 1; }
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
